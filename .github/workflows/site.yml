# Builds and publishes the site. Free GitHub features only: Actions + Pages (no secrets, no paid services).
#
# On every push to main (including saves from Pages CMS):
#   1. media   - tidies new photos in uploads/ (strip EXIF/GPS, sRGB, max 2000 px, .webp + thumbnails)
#                and commits the results back with the built-in GITHUB_TOKEN.
#   2. build   - builds the Jekyll site with actions/jekyll-build-pages (same github-pages gem set as
#                the classic Pages build, so `bundle exec jekyll build` locally matches).
#   3. deploy  - publishes it to GitHub Pages.
# Pushes to other branches only run the build, as a check; nothing is published.
#
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions" (one-time switch).
# Why not the classic "Deploy from a branch" build: commits pushed with GITHUB_TOKEN do not trigger
# a Pages build, so the photo clean-up commit would never go live. Building here avoids that.

name: Build and publish site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    name: Prepare uploaded photos
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install --disable-pip-version-check "pillow>=10,<12" "pillow-heif>=0.16,<1"
      - name: Clean, resize and convert new photos
        run: python3 tools/media/process_uploads.py
      - name: Commit processed photos
        id: commit
        run: |
          git add -A uploads _data/image_sizes.yml _data _journal
          if git diff --cached --quiet; then
            echo "No photo changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Prepare uploaded photos (strip metadata, resize, WebP)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build site
    needs: media
    if: ${{ !cancelled() && (needs.media.result == 'success' || needs.media.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.media.outputs.sha || github.sha }}
      - name: Build with Jekyll (github-pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check every page keeps noindex and the strict CSP
        run: |
          fail=0
          for f in $(find _site -name '*.html'); do
            grep -q 'name="robots" content="noindex, nofollow"' "$f" || { echo "missing noindex: $f"; fail=1; }
            grep -q "form-action 'none'" "$f" || { echo "missing CSP: $f"; fail=1; }
          done
          exit $fail
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
