# Pages CMS (https://pagescms.org): the editor Jessica signs in to.
# Each entry below is one screen in the editor. Saving commits the change to the repository;
# GitHub Actions then tidies any new photos and rebuilds the site (see docs/EDITING-GUIDE.md).

media:
  - name: photos
    label: Photos
    input: uploads
    output: /uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp, heic, heif]
  - name: videos
    label: Videos
    input: uploads/videos
    output: /uploads/videos
    rename: safe
    extensions: [mp4]
  - name: site_photos
    label: Original site photos (pick only, please don't upload here)
    input: assets/images
    output: /assets/images
    extensions: [jpg, png, webp]

settings:
  hide: true
  content:
    merge: true
  commit:
    templates:
      create: "Add {path} (via Pages CMS by {userName})"
      update: "Update {path} (via Pages CMS by {userName})"
      delete: "Delete {path} (via Pages CMS by {userName})"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS by {userName})"

components:
  photo:
    label: Photo
    type: image
    description: Upload a new photo or pick one you've already used. Big phone photos are fine; they're resized and cleaned automatically.
    options:
      media: photos
  photo_description:
    label: Photo description (for screen readers)
    type: text
    description: Describe what's in the photo in a sentence, as if to someone who can't see it. Please don't name the kids.
  link:
    label: Link
    type: string
    description: A full web address starting with https:// (or a page on this site, like gallery.html). Leave empty if there isn't one yet.
  location:
    label: Location
    type: string
    description: "Shown at the end of the caption, e.g. Greater Salt Lake Area, UT"

content:
  # ---------------------------------------------------------------- Home
  - name: home
    label: Home page
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: hero
        label: Welcome (top of the page)
        type: object
        fields:
          - { name: eyebrow, label: Small heading above the title, type: string }
          - { name: heading, label: Big title, type: string }
          - { name: heading_highlight, label: "Big title (second half, in italics)", type: string }
          - { name: tagline, label: Greeting, type: string }
          - { name: intro, label: Welcome text, type: text }
          - name: main_button
            label: Main button
            type: object
            fields:
              - { name: text, label: Button text, type: string }
              - { name: link, component: link }
          - name: second_button
            label: Second button
            type: object
            fields:
              - { name: text, label: Button text, type: string }
              - { name: link, component: link }
          - { name: small_print, label: Line under the buttons, type: string }
          - { name: location, label: Location (after the line under the buttons), type: string }
          - { name: photo, component: photo, label: Big photo }
          - { name: photo_description, component: photo_description }
          - { name: caption, label: Photo caption, type: string }
      - name: about
        label: A little about me
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: photo, component: photo, label: Round photo }
          - { name: photo_description, component: photo_description }
          - { name: link_text, label: Link text (goes to the About page), type: string }
      - name: room_tours
        label: Room tours preview
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: link_text, label: Link text (goes to Room Tours), type: string }
          - name: cards
            label: Rooms shown on the home page
            type: object
            list: { min: 1, max: 8, collapsible: { collapsed: true, summary: "{label}: {title}" } }
            fields:
              - { name: photo, component: photo }
              - { name: photo_description, component: photo_description }
              - { name: label, label: Room name (small caps), type: string }
              - { name: title, label: Title, type: string }
              - { name: link, component: link, description: "Usually gallery.html (the Room Tours page)." }
      - name: shop
        label: Shop section (the items themselves are under Shop)
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text, type: text }
      - name: journal
        label: Journal section (the posts themselves are under Journal posts)
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text, type: text }
          - { name: how_many_posts, label: How many posts to show, type: number, default: 3 }
      - name: follow
        label: Follow along
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text, type: text }
      - name: newsletter
        label: Newsletter box
        type: object
        fields:
          - { name: heading, label: Title, type: string }
          - { name: text, label: Text (the newsletter name is added at the end), type: text }
          - { name: name, label: Newsletter name, type: string }
      - name: work_with_me
        label: Work with me (contact form)
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text, type: text }
          - { name: media_kit_line, label: Media kit line (leave empty to hide), type: string }
          - { name: reasons, label: "Choices in the What's-this-about menu", type: string, list: true }
          - { name: message_hint, label: Hint inside the message box, type: string }
          - { name: button_text, label: Send button text, type: string }

  # ---------------------------------------------------------------- Room tours
  - name: room_tours
    label: Room tours
    type: file
    path: _data/room_tours.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Small heading, type: string }
      - { name: heading, label: Title, type: string }
      - { name: intro, label: Intro text, type: text }
      - name: filters
        label: Filter buttons
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}" } }
        description: Only the button wording can change here. Ask Cody to add a brand-new room type.
        fields:
          - { name: key, label: Code (don't change), type: string, readonly: true }
          - { name: label, label: Button text, type: string }
      - name: videos
        label: Videos (shown first)
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}: {caption}" } }
        fields:
          - name: room_type
            label: Room type (for the filter buttons)
            type: select
            options:
              values:
                - { name: closets, label: Closets & Storage }
                - { name: bedrooms, label: Bedrooms }
                - { name: living-spaces, label: Living Spaces }
                - { name: offices, label: Offices & Flex Rooms }
                - { name: laundry, label: Laundry Rooms }
                - { name: pantries, label: Pantries }
                - { name: playrooms, label: Playrooms }
          - { name: label, label: Room label (small caps under the video), type: string }
          - { name: caption, label: Caption, type: string }
          - { name: location, component: location }
          - name: video
            label: Video (MP4)
            type: file
            description: An .mp4 file, ideally under 50 MB and filmed upright (9:16).
            options: { media: videos }
          - { name: poster, component: photo, label: Still photo shown before it plays }
          - { name: video_description, label: What the video shows (for screen readers), type: string }
          - { name: download_name, label: Word used in "Download the ___ video", type: string }
      - name: tours
        label: Photo tours
        type: object
        list: { collapsible: { collapsed: true, summary: "{label}: {caption}" } }
        fields:
          - name: room_type
            label: Room type (for the filter buttons)
            type: select
            options:
              values:
                - { name: closets, label: Closets & Storage }
                - { name: bedrooms, label: Bedrooms }
                - { name: living-spaces, label: Living Spaces }
                - { name: offices, label: Offices & Flex Rooms }
                - { name: laundry, label: Laundry Rooms }
                - { name: pantries, label: Pantries }
                - { name: playrooms, label: Playrooms }
          - { name: label, label: Room label (small caps under the photo), type: string }
          - { name: caption, label: Caption, type: string }
          - { name: location, component: location }
          - name: tile_shape
            label: Tile shape
            type: select
            default: portrait
            options:
              values:
                - { name: portrait, label: Tall (most rooms) }
                - { name: landscape, label: Wide }
          - { name: cover_photo, component: photo, label: Cover photo }
          - { name: cover_photo_description, component: photo_description }
          - name: more_photos
            label: More photos (open when someone clicks the cover)
            type: object
            list: { collapsible: { collapsed: true, summary: "{kind} {index}" } }
            fields:
              - { name: photo, component: photo }
              - { name: photo_description, component: photo_description }
              - name: kind
                label: Label
                type: select
                default: Photo
                options:
                  values:
                    - { name: Photo, label: Photo (numbered automatically) }
                    - { name: Detail, label: Detail }
                    - { name: Before, label: Before }
                    - { name: Design, label: Design (rendering) }

  # ---------------------------------------------------------------- Shop
  - name: shop
    label: Shop
    type: file
    path: _data/shop.yml
    format: yaml
    fields:
      - name: items
        label: Favorite finds
        type: object
        list: { collapsible: { collapsed: true, summary: "{category}: {name}" } }
        fields:
          - { name: category, label: Category (e.g. Lighting), type: string }
          - { name: name, label: Product name, type: string }
          - { name: store, label: Store, type: string }
          - { name: link, component: link, label: Product link, description: "The full https:// address of the product page (affiliate links are fine). It opens in a new tab." }
          - { name: photo, component: photo, label: Product photo (optional) }
          - { name: photo_description, component: photo_description }
          - { name: note, label: Short note (optional), type: string }

  # ---------------------------------------------------------------- Journal
  - name: journal
    label: Journal posts
    type: collection
    path: _journal
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, coming_soon, date]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: category, label: "Category (e.g. Color, Styling)", type: string }
      - { name: coming_soon, label: "Coming soon (shows a teaser card only, not linked)", type: boolean, default: false }
      - { name: cover_photo, component: photo, label: Cover photo }
      - { name: cover_photo_description, component: photo_description }
      - { name: summary, label: One-sentence summary (for search and sharing), type: text }
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          media: photos

  # ---------------------------------------------------------------- About
  - name: about
    label: About page
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: meet
        label: Meet the Designer
        type: object
        fields:
          - { name: heading_small, label: Title (first words), type: string }
          - { name: heading_script, label: Title (script word), type: string }
          - { name: photo, component: photo, label: Portrait }
          - { name: photo_description, component: photo_description }
          - { name: signature_name, label: Name under the photo, type: string }
          - { name: signature_title, label: Title under the name, type: string }
          - { name: story, label: Story (one box per paragraph), type: text, list: true }
      - name: family
        label: Our family (text only; the photos stay as they are)
        type: object
        fields:
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text (leave empty to hide), type: text }
          - { name: captions, label: "Photo captions (1: big photo, 2: snow photo, 3: summer photo)", type: string, list: { min: 3, max: 3 } }
      - name: what_i_share
        label: What I share
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Title, type: string }
          - { name: intro, label: Text, type: text }
          - name: cards
            label: Cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }

  # ---------------------------------------------------------------- Site-wide
  - name: social
    label: Social links
    type: file
    path: _data/social.yml
    format: yaml
    fields:
      - name: links
        label: Accounts (Follow along + footer)
        type: object
        list: { collapsible: { collapsed: true, summary: "{name} {handle}" } }
        fields:
          - name: name
            label: Network
            type: select
            options: { values: [Instagram, Pinterest, TikTok, YouTube, Facebook, Other] }
          - { name: handle, label: Handle (e.g. @foxandfable.design), type: string }
          - { name: link, component: link, label: Profile link }
  - name: call_to_action
    label: Work-with-me band (About + Room Tours)
    type: file
    path: _data/call_to_action.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Small heading, type: string }
      - { name: heading, label: Title, type: string }
      - { name: text, label: Text, type: text }
      - { name: button_text, label: Button text, type: string }
      - { name: button_link, component: link, label: Button link }
  - name: settings
    label: Footer & contact
    type: file
    path: _data/settings.yml
    format: yaml
    fields:
      - { name: contact_email, label: Contact email, type: string }
      - { name: contact_email_is_placeholder, label: Show "(placeholder)" after the email, type: boolean }
      - { name: footer_tagline, label: Footer tagline, type: string }
      - { name: footer_blurb, label: Footer text, type: text }
      - { name: footer_location, label: Footer location, type: string }
      - { name: footer_copyright, label: Copyright line (after the year), type: string }
      - { name: footer_note, label: Footer note, type: string }
  - name: seo
    label: Page titles & share text
    type: file
    path: _data/seo.yml
    format: yaml
    fields:
      - name: home
        label: Home page
        type: object
        fields:
          - { name: browser_tab_title, label: Browser tab title, type: string }
          - { name: search_description, label: Search description, type: text }
          - { name: share_title, label: Title when shared, type: string }
          - { name: share_description, label: Text when shared, type: text }
      - name: room_tours
        label: Room Tours page
        type: object
        fields:
          - { name: browser_tab_title, label: Browser tab title, type: string }
          - { name: search_description, label: Search description, type: text }
          - { name: share_title, label: Title when shared, type: string }
          - { name: share_description, label: Text when shared, type: text }
      - name: about
        label: About page
        type: object
        fields:
          - { name: browser_tab_title, label: Browser tab title, type: string }
          - { name: search_description, label: Search description, type: text }
          - { name: share_title, label: Title when shared, type: string }
          - { name: share_description, label: Text when shared, type: text }
