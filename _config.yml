# Fox & Fable: Jekyll config.
# Jessica edits content (text, photos, links, journal posts) in Pages CMS; those edits land in
# _data/*.yml and _journal/*.md. The page structure lives in _layouts/ and _includes/.
# Build: GitHub Actions (.github/workflows/site.yml) runs actions/jekyll-build-pages, the same
# github-pages gem set as the classic Pages build. Locally: `bundle exec jekyll build`.

title: Fox & Fable
# Public domain used for canonical/Open Graph URLs (placeholder until launch).
canonical_base: https://www.foxandfable.com

# Bump when css/styles.css or js/main.js change so browsers fetch the new files.
asset_version: 19

# Pages link to each other with relative URLs (index.html, assets/...), so the site works both
# at cschlawin.github.io/fox-and-fable-design/ and at a custom domain root. Keep baseurl empty.
baseurl: ""

# No Jekyll theme: the site has its own CSS (stops github-pages adding assets/css/style.css).
theme: null

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: false

collections:
  journal:
    output: true
    permalink: /journal/:name.html

defaults:
  - scope:
      path: ""
      type: journal
    values:
      layout: post
      root: "../"

# Files Jekyll would skip by default (leading underscore) that should still be published.
include:
  - _headers

exclude:
  - README.md
  - SECURITY.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - docs/
  - tools/
  - vendor/
  - node_modules/
  - .pages.yml
  - .github/
  - uploads/.processed.json
