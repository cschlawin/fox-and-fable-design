  <!-- Lightbox (native <dialog>). Filled with textContent / validated same-origin URLs only. -->
  <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-caption">
    <div class="lightbox-inner">
      <img id="lightbox-img" src="assets/images/placeholders/landscape.svg" width="1600" height="1200" alt="">
      <p class="lightbox-caption" id="lightbox-caption">Project photo</p>
      <div class="lightbox-controls">
        <button class="lightbox-btn" type="button" data-lightbox="prev">← Previous</button>
        <span class="lightbox-count" id="lightbox-count"></span>
        <button class="lightbox-btn" type="button" data-lightbox="next">Next →</button>
        <button class="lightbox-btn" type="button" data-lightbox="close">Close</button>
      </div>
    </div>
  </dialog>
