{%- assign cta = site.data.call_to_action -%}
{%- include safe-link.html url=cta.button_link %}
    <section class="section cta-band" aria-labelledby="cta-title">
      <div class="container">
        <p class="eyebrow">{{ cta.eyebrow | escape }}</p>
        <h2 id="cta-title">{{ cta.heading | escape }}</h2>
        <p>{{ cta.text | escape }}</p>
        <a class="btn btn-light" href="{{ safe_href | escape }}"{% if is_external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ cta.button_text | escape }}</a>
      </div>
    </section>
